# it is not a training-distribution SD or a physical millimetre scale.
reference_labels: [a, i, u]
window:
  center_s: 0.56
  sigma_s: 0.06
  radius_s: 0.18
epsilons_sd: [0.01, 0.02, 0.05, 0.10]
validation:
  seeds: [101, 102, 103, 104]
  amplitudes_sd: [0.02, 0.05]
  max_median_relative_prediction_error: 0.5
  min_median_cosine: 0.8
  min_valid_fraction: 0.9
  max_primary_frame_shift_hz: [150, 250]
recovery:
  seeds: [201, 202, 203, 204]
  amplitudes_sd: [0.05, 0.10]
  gains: [0.1, 0.25, 0.5, 1.0]
  regularizations: [0.000001, 0.0001, 0.01]
  max_step_norm_sd: 0.10
  max_excursion_norm_sd: 0.5
source_correction:
  max_iterations: 10
  gains: [1.0, 0.5, 0.25, 0.1]
  regularizations: [0.000001, 0.0001, 0.01]
  max_step_norm_sd: 0.10
  max_excursion_norm_sd: 0.5
  relative_error_tolerance: 0.01
